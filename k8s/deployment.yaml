apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-flask
  template:
    metadata:
      labels:
        app: devops-flask
    spec:
      containers:
        - name: flask-app
          image: ghcr.io/pandas-max/devops-real-project:latest
          envFrom:
            - configMapRef:
                name: devops-flask-config
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
